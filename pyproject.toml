[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "signalsdr"
version = "0.1.0"
description = "Outbound agent that cannot send a claim it cannot prove."
requires-python = ">=3.11"
dependencies = [
  "langgraph",
  "langgraph-checkpoint-sqlite",
  "langchain-core",
  "langchain-aws",
  "neatlogs",
  "pydantic>=2",
  "pydantic-settings>=2",
  "httpx",
  "tenacity",
  "fastapi",
  "uvicorn",
  "python-multipart",
  "jinja2",
  "typer",
  "beautifulsoup4",
  "dnspython",
  "python-dotenv",
  "cryptography",
  "tzdata",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
